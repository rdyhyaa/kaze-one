<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaze Komik (Test)</title>
  <style>
    body { background: #121212; color: white; font-family: sans-serif; padding: 15px; }
    h1 { color: #ff3d00; text-align: center; }
    #search-box { width: 100%; padding: 10px; border-radius: 5px; border: none; margin-bottom: 15px; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
    .card { background: #1e1e1e; padding: 10px; border-radius: 5px; cursor: pointer; }
    .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 5px; }
    .card p { font-size: 12px; text-align: center; margin: 5px 0 0 0; }
    #detail, #reader { display: none; margin-top: 20px; }
    .back { background: #ff3d00; color: white; border: none; padding: 10px; border-radius: 5px; margin-bottom: 10px; cursor: pointer; }
    .ch-item { background: #1e1e1e; padding: 10px; margin-bottom: 5px; border-radius: 5px; cursor: pointer; }
    #reader img { width: 100%; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>

<div id="home">
  <h1>🥷 Kaze Komik (Test)</h1>
  <input type="text" id="search-box" placeholder="Ketik judul manga (contoh: One Piece)..." onkeypress="handleSearch(event)">
  <div id="grid"><p style="text-align:center; width:100%;">Ketik judul untuk mencari...</p></div>
</div>

<div id="detail">
  <button class="back" onclick="kembali()">← Kembali</button>
  <h2 id="detail-title"></h2>
  <div id="chapter-list"></div>
</div>

<div id="reader">
  <button class="back" onclick="tutupReader()">← Tutup</button>
  <div id="reader-img"></div>
</div>

<script>
// GANTI DENGAN URL VERCEL/RENDER LO NANTI
const API_URL = 'https://nik-nyora-sdk.vercel.app'; 

async function handleSearch(event) {
  if (event.key !== 'Enter') return;
  const q = document.getElementById('search-box').value;
  if (!q) return;

  const grid = document.getElementById('grid');
  grid.innerHTML = '<p>Mencari...</p>';

  try {
    const res = await fetch(`${API_URL}/api/search?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    
    grid.innerHTML = '';
    if (!data.results || data.results.length === 0) {
      grid.innerHTML = '<p>Tidak ditemukan.</p>';
      return;
    }

    data.results.forEach(manga => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => bukaDetail(manga);
      card.innerHTML = `<img src="${manga.image}" loading="lazy"><p>${manga.title}</p>`;
      grid.appendChild(card);
    });
  } catch (e) {
    grid.innerHTML = '<p style="color:red;">Gagal mencari. Cek server lo.</p>';
  }
}

async function bukaDetail(manga) {
  document.getElementById('home').style.display = 'none';
  document.getElementById('detail').style.display = 'block';
  document.getElementById('detail-title').innerText = manga.title;
  document.getElementById('chapter-list').innerHTML = '<p>Memuat chapter...</p>';
  window.scrollTo(0, 0);

  try {
    const res = await fetch(`${API_URL}/api/details?id=${manga.id}`);
    const data = await res.json();
    
    const list = document.getElementById('chapter-list');
    list.innerHTML = '';
    if (!data.chapters || data.chapters.length === 0) {
      list.innerHTML = '<p>Belum ada chapter.</p>';
      return;
    }

    data.chapters.forEach(ch => {
      const div = document.createElement('div');
      div.className = 'ch-item';
      div.innerText = ch.name || `Chapter ${ch.number}`;
      div.onclick = () => bacaChapter(manga.id, ch.id);
      list.appendChild(div);
    });
  } catch (e) {
    document.getElementById('chapter-list').innerHTML = '<p style="color:red;">Gagal memuat detail.</p>';
  }
}

async function bacaChapter(mangaId, chapterId) {
  document.getElementById('detail').style.display = 'none';
  document.getElementById('reader').style.display = 'block';
  document.getElementById('reader-img').innerHTML = '<p>Memuat gambar...</p>';
  window.scrollTo(0, 0);

  try {
    const res = await fetch(`${API_URL}/api/pages?mangaId=${mangaId}&chapterId=${chapterId}`);
    const pages = await res.json();
    
    const container = document.getElementById('reader-img');
    container.innerHTML = '';
    if (!pages || pages.length === 0) {
      container.innerHTML = '<p style="color:red;">Gambar tidak tersedia.</p>';
      return;
    }

    pages.forEach(page => {
      const img = document.createElement('img');
      // Pastiin URL gambar bener
      img.src = page.url || page; 
      img.loading = 'lazy';
      container.appendChild(img);
    });
  } catch (e) {
    document.getElementById('reader-img').innerHTML = '<p style="color:red;">Gagal memuat gambar.</p>';
  }
}

function kembali() {
  document.getElementById('detail').style.display = 'none';
  document.getElementById('home').style.display = 'block';
}
function tutupReader() {
  document.getElementById('reader').style.display = 'none';
  document.getElementById('detail').style.display = 'block';
  document.getElementById('reader-img').innerHTML = '';
}
</script>
</body>
  </html>
